openapi: 3.0.3
info:
  title: Clover Server API
  version: 1.0.0
  description: Clover Server HTTP API。除特别标注外，受保护接口需要 Bearer JWT。
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Article
  - name: Comment
  - name: Data
  - name: Focus
  - name: GlobalNotification
  - name: Search
  - name: Chat
  - name: SiteMessage
  - name: Image
  - name: Site
  - name: Log
  - name: Banner
  - name: Captcha
  - name: User
paths:
  /article/list:
    get:
      tags:
        - Article
      summary: 文章列表
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Category'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /article/detail:
    get:
      tags:
        - Article
      summary: 文章详情
      security: []
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /article:
    post:
      tags:
        - Article
      summary: 创建文章
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags:
        - Article
      summary: 更新文章
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - Article
      summary: 删除文章
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /article/category/list:
    get:
      tags:
        - Article
      summary: 分类列表
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /article/category/options:
    get:
      tags:
        - Article
      summary: 分类选项
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /article/category:
    post:
      tags:
        - Article
      summary: 创建分类
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /comment:
    post:
      tags:
        - Comment
      summary: 创建评论
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    get:
      tags:
        - Comment
      summary: 评论列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /comment/tree/{id}:
    get:
      tags:
        - Comment
      summary: 评论树
      security: []
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /comment/{id}:
    delete:
      tags:
        - Comment
      summary: 删除评论
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /comment/digg/{id}:
    get:
      tags:
        - Comment
      summary: 评论点赞
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /data/sum:
    get:
      tags:
        - Data
      summary: 数据汇总
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /data/article/year:
    get:
      tags:
        - Data
      summary: 年度文章数据
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /data/computer:
    get:
      tags:
        - Data
      summary: 设备数据
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /data/growth:
    get:
      tags:
        - Data
      summary: 增长数据
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /focus:
    post:
      tags:
        - Focus
      summary: 关注用户
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - Focus
      summary: 取消关注
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /focus/my_focus:
    get:
      tags:
        - Focus
      summary: 我的关注
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /focus/my_fans:
    get:
      tags:
        - Focus
      summary: 我的粉丝
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /global_notification:
    post:
      tags:
        - GlobalNotification
      summary: 创建全局通知
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    get:
      tags:
        - GlobalNotification
      summary: 全局通知列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - GlobalNotification
      summary: 删除全局通知
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /global_notification/user:
    post:
      tags:
        - GlobalNotification
      summary: 处理用户全局通知
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /search/article:
    get:
      tags:
        - Search
      summary: 搜索文章
      security: []
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /search/tags:
    get:
      tags:
        - Search
      summary: 聚合标签
      security: []
      parameters:
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /search/text:
    get:
      tags:
        - Search
      summary: 搜索文本
      security: []
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /chat:
    get:
      tags:
        - Chat
      summary: 聊天列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - Chat
      summary: 删除聊天
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /chat/session:
    get:
      tags:
        - Chat
      summary: 聊天会话列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /chat/user/{id}:
    delete:
      tags:
        - Chat
      summary: 删除与指定用户的聊天
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /chat/read/{id}:
    post:
      tags:
        - Chat
      summary: 标记聊天已读
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /chat/ws:
    get:
      tags:
        - Chat
      summary: Chat WebSocket 连接
      security: []
      description: 此端点升级为 WebSocket，连接地址为 `/api/chat/ws`（HTTPS 时使用 `wss`）。请使用 WebSocket 客户端连接，不通过 Swagger UI 的 Execute 发起。
      responses:
        '101':
          description: Switching Protocols
  /site_msg:
    get:
      tags:
        - SiteMessage
      summary: 站内消息列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags:
        - SiteMessage
      summary: 标记站内消息已读
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - SiteMessage
      summary: 删除站内消息
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /site_msg/conf:
    get:
      tags:
        - SiteMessage
      summary: 获取站内消息配置
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags:
        - SiteMessage
      summary: 更新站内消息配置
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /site_msg/user:
    get:
      tags:
        - SiteMessage
      summary: 用户消息
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /images:
    post:
      tags:
        - Image
      summary: 上传图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
    get:
      tags:
        - Image
      summary: 图片列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - Image
      summary: 删除图片
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /images/qiniu:
    post:
      tags:
        - Image
      summary: 生成七牛上传令牌
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /site/qq_url:
    get:
      tags:
        - Site
      summary: 获取 QQ 登录地址
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /site/{name}:
    get:
      tags:
        - Site
      summary: 获取站点配置
      security: []
      parameters:
        - $ref: '#/components/parameters/NamePath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags:
        - Site
      summary: 更新站点配置
      security: []
      parameters:
        - $ref: '#/components/parameters/NamePath'
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /logs:
    get:
      tags:
        - Log
      summary: 日志列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - Log
      summary: 删除日志
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /logs/{id}:
    get:
      tags:
        - Log
      summary: 阅读日志
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /banner:
    get:
      tags:
        - Banner
      summary: Banner 列表
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags:
        - Banner
      summary: 创建 Banner
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
        - Banner
      summary: 删除 Banner
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /banner/{id}:
    put:
      tags:
        - Banner
      summary: 更新 Banner
      parameters:
        - $ref: '#/components/parameters/IDPath'
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /captcha:
    get:
      tags:
        - Captcha
      summary: 获取验证码
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/send_email:
    post:
      tags:
        - User
      summary: 发送邮箱验证码
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/email:
    post:
      tags:
        - User
      summary: 邮箱注册
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/qq:
    post:
      tags:
        - User
      summary: QQ 登录
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/login:
    post:
      tags:
        - User
      summary: 密码登录
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/detail:
    get:
      tags:
        - User
      summary: 当前用户详情
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/base_info:
    get:
      tags:
        - User
      summary: 当前用户基础信息
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/login_list:
    post:
      tags:
        - User
      summary: 登录记录列表
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/password:
    put:
      tags:
        - User
      summary: 更新密码
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/password/reset:
    put:
      tags:
        - User
      summary: 重置密码
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/email/bind:
    put:
      tags:
        - User
      summary: 绑定邮箱
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user:
    put:
      tags:
        - User
      summary: 更新用户信息
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /user/admin:
    put:
      tags:
        - User
      summary: 管理员更新用户信息
      requestBody:
        $ref: '#/components/requestBodies/FlexibleObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <JWT>'
  parameters:
    IDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 资源 ID
    NamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: 配置名称
    IDQuery:
      name: id
      in: query
      schema:
        type: string
      description: 资源 ID
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 页码
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
      description: 每页数量
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
      description: 搜索关键词
    Category:
      name: category
      in: query
      schema:
        type: string
      description: 分类 ID 或名称
    Year:
      name: year
      in: query
      schema:
        type: integer
      description: 年份
  requestBodies:
    FlexibleObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          example:
            id: example-id
  responses:
    Success:
      description: 通用业务响应
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: 通用错误响应
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
