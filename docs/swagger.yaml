basePath: /api
definitions:
  article_api.ArticleCreateRequest:
    properties:
      abstract:
        type: string
      categoryID:
        type: integer
      content:
        type: string
      cover:
        type: string
      openComment:
        type: boolean
      status:
        enum:
        - 1
        - 2
        - 3
        - 4
        type: integer
      tagList:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - content
    - status
    - title
    type: object
  article_api.ArticleUpdateRequest:
    properties:
      abstract:
        type: string
      categoryID:
        type: integer
      content:
        type: string
      cover:
        type: string
      id:
        type: integer
      openComment:
        type: boolean
      status:
        enum:
        - 1
        - 2
        - 3
        - 4
        type: integer
      tagList:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - content
    - id
    - status
    - title
    type: object
  article_api.CategoryCreateRequest:
    properties:
      id:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  models.IDRequest:
    properties:
      id:
        type: integer
    type: object
  models.RemoveRequest:
    properties:
      idList:
        items:
          type: integer
        type: array
    type: object
  res.ArticleData:
    properties:
      abstract:
        type: string
      categoryID:
        type: integer
      collectCount:
        type: integer
      commentCount:
        type: integer
      content:
        type: string
      cover:
        type: string
      diggCount:
        type: integer
      id:
        type: integer
      lookCount:
        type: integer
      openComment:
        type: boolean
      status:
        type: integer
      tagList:
        items:
          type: string
        type: array
      title:
        type: string
      userID:
        type: integer
    type: object
  res.ArticleDetailData:
    properties:
      abstract:
        type: string
      categoryID:
        type: integer
      categoryTitle:
        type: string
      collectCount:
        type: integer
      commentCount:
        type: integer
      content:
        type: string
      cover:
        type: string
      diggCount:
        type: integer
      id:
        type: integer
      isCollect:
        type: boolean
      isDigg:
        type: boolean
      lookCount:
        type: integer
      nickname:
        type: string
      openComment:
        type: boolean
      status:
        type: integer
      tagList:
        items:
          type: string
        type: array
      title:
        type: string
      userAvatar:
        type: string
      userID:
        type: integer
      username:
        type: string
    type: object
  res.ArticleDetailResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        $ref: '#/definitions/res.ArticleDetailData'
      msg:
        example: 成功
        type: string
    type: object
  res.ArticleListData:
    properties:
      count:
        type: integer
      list:
        items:
          $ref: '#/definitions/res.ArticleListItem'
        type: array
    type: object
  res.ArticleListItem:
    properties:
      abstract:
        type: string
      categoryID:
        type: integer
      categoryTitle:
        type: string
      collectCount:
        type: integer
      commentCount:
        type: integer
      cover:
        type: string
      diggCount:
        type: integer
      id:
        type: integer
      lookCount:
        type: integer
      openComment:
        type: boolean
      status:
        type: integer
      tagList:
        items:
          type: string
        type: array
      title:
        type: string
      userAvatar:
        type: string
      userID:
        type: integer
      userNickname:
        type: string
    type: object
  res.ArticleListResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        $ref: '#/definitions/res.ArticleListData'
      msg:
        example: 成功
        type: string
    type: object
  res.ArticleResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        $ref: '#/definitions/res.ArticleData'
      msg:
        example: 成功
        type: string
    type: object
  res.Code:
    enum:
    - 0
    - 1001
    - 1002
    type: integer
    x-enum-comments:
      FailServiceCode: 服务异常
      FailValidCode: 校验失败
      SuccessCode: 成功
    x-enum-descriptions:
    - 成功
    - 校验失败
    - 服务异常
    x-enum-varnames:
    - SuccessCode
    - FailValidCode
    - FailServiceCode
  res.EmailCodeData:
    properties:
      emailID:
        type: string
    type: object
  res.EmailCodeResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        $ref: '#/definitions/res.EmailCodeData'
      msg:
        example: 成功
        type: string
    type: object
  res.ErrorResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 1001
      data:
        additionalProperties:
          type: string
        type: object
      msg:
        example: 参数校验失败
        type: string
    type: object
  res.ImageUploadData:
    properties:
      filename:
        type: string
      hash:
        type: string
      path:
        type: string
      size:
        type: integer
      web_path:
        type: string
    type: object
  res.ImageUploadResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        $ref: '#/definitions/res.ImageUploadData'
      msg:
        example: 成功
        type: string
    type: object
  res.MessageResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        additionalProperties:
          type: string
        type: object
      msg:
        example: 操作成功
        type: string
    type: object
  res.QiNiuTokenData:
    properties:
      key:
        type: string
      region:
        type: string
      token:
        type: string
    type: object
  res.QiNiuTokenResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        $ref: '#/definitions/res.QiNiuTokenData'
      msg:
        example: 成功
        type: string
    type: object
  res.TokenResponse:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/res.Code'
        example: 0
      data:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      msg:
        example: 成功
        type: string
    type: object
  user_api.PwdLoginSwaggerRequest:
    properties:
      code:
        type: string
      id:
        type: string
      password:
        type: string
      val:
        type: string
    required:
    - password
    - val
    type: object
  user_api.RegisterEmailRequest:
    properties:
      emailCode:
        type: string
      emailID:
        type: string
      pwd:
        type: string
    required:
    - emailCode
    - emailID
    - pwd
    type: object
  user_api.ResetPasswordSwaggerRequest:
    properties:
      emailCode:
        type: string
      emailID:
        type: string
      pwd:
        type: string
    required:
    - emailCode
    - emailID
    - pwd
    type: object
  user_api.SendEmailRequest:
    properties:
      email:
        type: string
      type:
        type: string
    type: object
  user_api.UpdatePasswordRequest:
    properties:
      oldPwd:
        type: string
      pwd:
        type: string
    required:
    - oldPwd
    - pwd
    type: object
info:
  contact: {}
  description: Clover Server 的 REST API 文档。
  title: Clover Server API
  version: "1.0"
paths:
  /article:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 文章 ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 文章删除成功
          schema:
            $ref: '#/definitions/res.MessageResponse'
        "400":
          description: 参数、归属或认证失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除文章
      tags:
      - 文章
    post:
      consumes:
      - application/json
      description: '`title`、`content`、`status` 必填。status：1 草稿、2 审核中、3 已发布、4 已拒绝。'
      parameters:
      - description: 文章内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/article_api.ArticleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建后的完整文章
          schema:
            $ref: '#/definitions/res.ArticleResponse'
        "400":
          description: 参数、分类或认证失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 文章
    put:
      consumes:
      - application/json
      description: '`id`、`title`、`content`、`status` 必填。status：1 草稿、2 审核中、3 已发布、4 已拒绝。'
      parameters:
      - description: 更新后的文章内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/article_api.ArticleUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 文章更新成功
          schema:
            $ref: '#/definitions/res.MessageResponse'
        "400":
          description: 参数、归属、分类或认证失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - 文章
  /article/category:
    post:
      consumes:
      - application/json
      description: '`id` 为 0 时创建分类；非 0 时更新当前用户已有分类。'
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/article_api.CategoryCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 分类创建或更新成功
          schema:
            $ref: '#/definitions/res.MessageResponse'
        "400":
          description: 参数、归属或认证失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建或更新文章分类
      tags:
      - 文章
  /article/detail:
    get:
      description: 未登录用户只能读取已发布文章；携带 Bearer JWT 时可读取本人文章，管理员可读取任意文章。
      parameters:
      - description: 文章 ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 文章详情
          schema:
            $ref: '#/definitions/res.ArticleDetailResponse'
        "400":
          description: 参数或文章可见性校验失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      summary: 获取文章详情
      tags:
      - 文章
  /article/list:
    get:
      description: '`type=1` 为指定用户已发布文章，必须提供 `userID`；`type=2` 为当前登录用户文章，需 Bearer
        JWT；`type=3` 为管理员视图，需管理员 Bearer JWT。`status` 用于状态筛选。'
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 100
        in: query
        name: limit
        type: integer
      - description: 标题或摘要关键字
        in: query
        name: key
        type: string
      - description: 排序字段，默认 id desc
        in: query
        name: order
        type: string
      - description: 列表类型：1 用户公开文章；2 我的文章；3 管理员文章
        in: query
        name: type
        required: true
        type: integer
      - description: 用户 ID；type=1 时必填，type=3 时可选
        in: query
        name: userID
        type: integer
      - description: 分类 ID
        in: query
        name: categoryID
        type: integer
      - description: 文章状态
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data 包含 list 与 count
          schema:
            $ref: '#/definitions/res.ArticleListResponse'
        "400":
          description: 参数或权限校验失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      summary: 获取文章列表
      tags:
      - 文章
  /images:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 待删除的图片 ID 列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RemoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 图片删除成功
          schema:
            $ref: '#/definitions/res.MessageResponse'
        "400":
          description: 参数、认证或图片存在性校验失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 删除失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除图片
      tags:
      - 图片
    post:
      consumes:
      - multipart/form-data
      description: 仅管理员可调用。实际配置最大 10MB，仅接受 jpg、jpeg、png、webp、gif；服务以文件 MD5 去重，成功后返回本地及
        Web 访问路径。
      parameters:
      - description: 图片文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            $ref: '#/definitions/res.ImageUploadResponse'
        "400":
          description: 文件缺失、大小或格式不合法
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 存储服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 上传图片
      tags:
      - 图片
  /images/qiniu:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 七牛 bucket、上传 token 与区域
          schema:
            $ref: '#/definitions/res.QiNiuTokenResponse'
        "400":
          description: 七牛云未启用
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 生成上传凭证失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取七牛云上传凭证
      tags:
      - 图片
  /user/email:
    post:
      consumes:
      - application/json
      description: '`emailID` 和 `emailCode` 必须由发送邮件验证码流程获得；路由实际由邮箱验证码中间件校验后才执行。'
      parameters:
      - description: 邮箱注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user_api.RegisterEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功，data 为 JWT
          schema:
            $ref: '#/definitions/res.TokenResponse'
        "400":
          description: 参数校验、验证码或注册失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      summary: 邮箱注册
      tags:
      - 用户
  /user/login:
    post:
      consumes:
      - application/json
      description: 公开接口。`val` 为用户名或邮箱，`password` 为账户密码；启用图形验证码时，验证码中间件额外校验 `id`（验证码
        ID）和 `code`（验证码文本）。
      parameters:
      - description: 用户名或邮箱、密码及可选图形验证码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user_api.PwdLoginSwaggerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，data 为 JWT
          schema:
            $ref: '#/definitions/res.TokenResponse'
        "400":
          description: 参数校验、图形验证码或账号密码错误
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      summary: 密码登录
      tags:
      - 用户
  /user/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: 旧密码与新密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user_api.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 密码修改成功
          schema:
            $ref: '#/definitions/res.MessageResponse'
        "400":
          description: 参数、认证或旧密码校验失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 用户
  /user/password/reset:
    put:
      consumes:
      - application/json
      description: 邮箱验证码中间件会从同一 JSON 请求体读取并校验 `emailID`、`emailCode`；校验成功后使用 `pwd`
        重置该邮箱账户密码。
      parameters:
      - description: 邮箱验证码与新密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user_api.ResetPasswordSwaggerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重置密码成功
          schema:
            $ref: '#/definitions/res.MessageResponse'
        "400":
          description: 参数、邮箱验证码或账户状态校验失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      summary: 重置密码
      tags:
      - 用户
  /user/send_email:
    post:
      consumes:
      - application/json
      description: 请求体 `type`：1 注册、2 重置密码、3 绑定邮箱。当前路由已配置邮箱验证码中间件，该中间件要求请求中同时带有有效的
        `emailID` 与 `emailCode`，因此直接首次调用会因中间件校验而无法进入本处理器；此处仅如实记录现状，未改变业务逻辑。
      parameters:
      - description: 邮箱及验证码用途
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user_api.SendEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 邮箱验证码标识
          schema:
            $ref: '#/definitions/res.EmailCodeResponse'
        "400":
          description: 参数、邮箱状态或中间件验证码校验失败
          schema:
            $ref: '#/definitions/res.ErrorResponse'
        "500":
          description: 邮件服务异常
          schema:
            $ref: '#/definitions/res.ErrorResponse'
      summary: 发送邮箱验证码
      tags:
      - 用户
schemes:
- https
- http
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer {JWT}，例如：Bearer eyJhbGciOiJIUzI1NiIs...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
